<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The top bar on every page once logged in. Logging out is a POST, so it carries the CSRF token. */-->
<nav th:fragment="nav" class="owner-nav">
    <a th:href="@{/owner}">My salons</a>
    <form method="post" th:action="@{/owner/logout}">
        <button type="submit" class="link">Log out</button>
    </form>
</nav>
</body>
</html>
