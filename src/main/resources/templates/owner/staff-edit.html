<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="|Edit staff · ${salon}|">Edit staff · Sipho's Cuts</title>
    <style th:replace="~{fragments :: style}"></style>
</head>
<body>
<main>
    <nav th:replace="~{owner/fragments :: nav}"></nav>
    <h1>Edit schedule</h1>
    <p><a th:href="@{/owner/salons/{id}/staff(id=${salonId})}">← Staff &amp; time off</a></p>
    <p th:if="${staffError != null}" class="error" role="alert" th:text="${staffError}">1 active booking would fall outside</p>
    <form method="post" class="booking-form" th:action="@{/owner/salons/{s}/staff/{id}(s=${salonId},id=${staffId})}" th:object="${form}">
        <th:block th:replace="~{owner/staff-fields :: fields(schedule=${form})}"></th:block>
        <p class="hint">A change that would leave an existing booking on a day off, outside working hours or in the break is refused: cancel that booking first.</p>
        <button type="submit">Save schedule</button>
    </form>
</main>
</body>
</html>
