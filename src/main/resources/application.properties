spring.application.name=salon-booking-api

# Hosting platforms (e.g. Render) say which port to use through the PORT variable.
server.port=${PORT:8080}

# Flyway owns the database schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Salons are in South Africa; "today" and "now" use this zone even if the server runs in UTC.
app.time-zone=Africa/Johannesburg
# Where clients reach the app; used to build the cancel links in reminders.
app.public-base-url=http://localhost:8080
# Gap between the start times offered to clients.
app.booking.slot-step=15m
# Appointment reminders: every hour from 18:00 to 21:00 (salon time), clients with a booking
# tomorrow get a reminder. Spring cron format: second minute hour day month weekday.
app.reminders.cron=0 0 18-21 * * *

springdoc.swagger-ui.path=/swagger-ui.html

# Login tokens. The signing key comes from the APP_SECURITY_JWT_SECRET environment variable
# in real deployments; locally it is left empty and a random key is generated at startup.
# app.security.jwt-secret=  (never commit a real value)
# Clients' cancel links are signed with a separate key (APP_SECURITY_CANCEL_LINK_SECRET), so
# each key has one job. Empty locally: a random key is generated at startup.
# app.security.cancel-link-secret=  (never commit a real value)
app.security.token-lifetime=1h
# Slows down password guessing. Per IP: all attempts. Per email: failed attempts only,
# reset by a successful login.
app.security.login-attempts-per-ip.attempts=20
app.security.login-attempts-per-ip.window=1m
app.security.failed-logins-per-email.attempts=5
app.security.failed-logins-per-email.window=15m

# Monitoring. Metrics (Prometheus format) are served on a separate port that is not
# published to the internet; a monitoring system scrapes it from inside the network.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
# Liveness and readiness checks also on the main port, for the hosting platform.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
