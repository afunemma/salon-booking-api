spring.application.name=salon-booking-api

# Flyway owns the database schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Salons are in South Africa; "today" and "now" use this zone even if the server runs in UTC.
app.time-zone=Africa/Johannesburg
# Gap between the start times offered to clients.
app.booking.slot-step=15m

springdoc.swagger-ui.path=/swagger-ui.html

# Login tokens. The signing key comes from the APP_SECURITY_JWT_SECRET environment variable
# in real deployments; locally it is left empty and a random key is generated at startup.
# app.security.jwt-secret=  (never commit a real value)
app.security.token-lifetime=1h
