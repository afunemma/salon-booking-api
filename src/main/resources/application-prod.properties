# Production settings, used with SPRING_PROFILES_ACTIVE=prod.
#
# The database connection comes from environment variables, never from this file:
#   SPRING_DATASOURCE_URL       e.g. jdbc:postgresql://<host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# and the signing keys from APP_SECURITY_JWT_SECRET and APP_SECURITY_CANCEL_LINK_SECRET.

# The public address used in cancel links. Render sets RENDER_EXTERNAL_URL automatically;
# on other platforms set APP_PUBLIC_BASE_URL instead.
app.public-base-url=${RENDER_EXTERNAL_URL}

# The app runs behind the platform's proxy. "native" makes Tomcat take the client IP from
# X-Forwarded-For, trusting only proxies on internal networks. Clients can't fake their IP
# by sending their own X-Forwarded-For header, which matters for the per-IP login limit.
server.forward-headers-strategy=native

# Free database plans allow few connections; a small pool is plenty for this app.
spring.datasource.hikari.maximum-pool-size=5
# Close connections after 1 minute idle and don't keep any open "just in case", so a
# serverless database (e.g. Neon) can sleep when nobody is booking, instead of being kept
# awake by idle connections and using up free compute hours. The first query after a quiet
# spell takes about a second longer while the database wakes up.
spring.datasource.hikari.minimum-idle=0
# (Hikari settings are in milliseconds.)
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
