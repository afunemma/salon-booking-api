# Test-only overrides, loaded on top of src/main/resources/application.properties.
# Every test logs in from 127.0.0.1, so the per-IP login limit would make tests fail at
# random. It is raised here and tested on its own in LoginAttemptLimiterTest.
app.security.login-attempts-per-ip.attempts=100000
# The reminder job is run by hand in ReminderJobIntegrationTest, never on a timer, so it
# can't run in the middle of other tests. "-" switches a cron job off.
app.reminders.cron=-
