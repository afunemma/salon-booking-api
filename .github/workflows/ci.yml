name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the build only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          total = lambda key: sum(int(row[key]) for row in rows)
          def percent(kind):
              covered, missed = total(f"{kind}_COVERED"), total(f"{kind}_MISSED")
              return 100 * covered / (covered + missed)
          print("### Test coverage")
          print("| Lines | Branches |")
          print("|---|---|")
          print(f"| {percent('LINE'):.1f}% | {percent('BRANCH'):.1f}% |")
          PY

      - name: Upload coverage report
        if: always() && hashFiles('target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  # Builds the production image (including the AOT cache training run), so a broken
  # Dockerfile is caught here instead of failing on the hosting platform.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag salon-booking-api:ci .
